name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional deps (validation + yaml)
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema PyYAML

      - name: Setup + import smoke test
        run: python scripts/setup_env.py

      - name: Validate schemas + registry manifest
        run: python scripts/validate_schemas.py

      - name: Run test suite
        run: python scripts/run_tests.py

      - name: Seed knowledge-base index
        run: python scripts/seed_knowledge_base.py
